name: Build XiaoZhi Firmware

on:
  push:
    branches:
      - feature/clean-s3-zero-firmware
      - feature/hi-jason-wake-word
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Hi Jason-only WakeNet selection and index fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("xiaozhi-esp32/main/audio/engines/afe_audio_engine.cc")
          s = p.read_text()
          old = 'wakenet_model_name = esp_srmodel_filter(models_, ESP_WN_PREFIX, nullptr);'
          assert s.count(old) == 1, "WakeNet selection source changed"
          s = s.replace(old, 'wakenet_model_name = esp_srmodel_filter(models_, ESP_WN_PREFIX, "hijason");')
          old = '    afe_config->wakenet_model_name = wake_detector_ == WakeDetector::kWakeNet\n        ? wakenet_model_name\n        : nullptr;'
          assert s.count(old) == 1, "AFE config source changed"
          s = s.replace(old, old + '\n    // Explicitly disable WakeNet slot 2: Hi Jason is the sole wake word.\n    afe_config->wakenet_model_name_2 = nullptr;')
          old = '    int model_index = result->wakenet_model_index - 1;\n    if (model_index < 0 || model_index >= static_cast<int>(wake_words_.size())) {\n        ESP_LOGE(TAG, "Invalid WakeNet model index: %d", result->wakenet_model_index);\n        return;\n    }\n\n    last_detected_wake_word_ = wake_words_[model_index];'
          new = '    if (result->wakenet_model_index != 1) {\n        ESP_LOGW(TAG, "Ignoring non-selected WakeNet model index: %d", result->wakenet_model_index);\n        return;\n    }\n    int word_index = result->wake_word_index - 1;\n    if (word_index < 0 || word_index >= static_cast<int>(wake_words_.size())) {\n        ESP_LOGE(TAG, "Invalid Hi Jason wake-word index: %d", result->wake_word_index);\n        return;\n    }\n\n    last_detected_wake_word_ = wake_words_[word_index];\n    ESP_LOGI(TAG, "Selected wake word detected: %s", last_detected_wake_word_.c_str());'
          assert s.count(old) == 1, "WakeNet result mapping source changed"
          s = s.replace(old, new)
          p.write_text(s)
          print("PASS: selected Hi Jason, disabled WakeNet slot 2, mapped phrase index")
          PY

      - name: Add rate-limited Opus, PCM and I2S diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("xiaozhi-esp32/main/audio")
          p = root / "audio_service.cc"
          s = p.read_text()

          old = """    playback_drained_notified_ = false;
              audio_decode_queue_.push_back(std::move(packet));
              audio_queue_cv_.notify_all();
              return true;
          }"""
          new = """    playback_drained_notified_ = false;
              static uint32_t opus_rx_log_count = 0;
              ++opus_rx_log_count;
              if (opus_rx_log_count <= 8 || opus_rx_log_count % 20 == 0) {
                  ESP_LOGI(TAG, "OPUS_RX: packet received bytes=%u rate=%d frame_ms=%d count=%u",
                           (unsigned)packet->payload.size(), packet->sample_rate,
                           packet->frame_duration, (unsigned)opus_rx_log_count);
              }
              audio_decode_queue_.push_back(std::move(packet));
              audio_queue_cv_.notify_all();
              return true;
          }"""
          assert s.count(old) == 1, "Could not locate incoming Opus packet queue insertion"
          s = s.replace(old, new)

          old = """                    }
                    decoded = true;
                } else {
                    ESP_LOGE(TAG, "Failed to decode audio after resize, error code: %d", ret);"""
          new = """                    }
                    uint32_t pcm_peak = 0;
                    for (int16_t sample : task->pcm) {
                        uint32_t magnitude = sample < 0 ? (uint32_t)(-(int32_t)sample) : (uint32_t)sample;
                        if (magnitude > pcm_peak) pcm_peak = magnitude;
                    }
                    static uint32_t opus_decode_log_count = 0;
                    ++opus_decode_log_count;
                    if (opus_decode_log_count <= 8 || opus_decode_log_count % 20 == 0) {
                        ESP_LOGI(TAG, "OPUS_DECODE: success samples=%u peak=%u rate=%d count=%u",
                                 (unsigned)task->pcm.size(), (unsigned)pcm_peak,
                                 codec_->output_sample_rate(), (unsigned)opus_decode_log_count);
                    }
                    decoded = true;
                } else {
                    ESP_LOGE(TAG, "OPUS_DECODE: failed error=%d", ret);"""
          assert s.count(old) == 1, "Could not locate Opus decoder success branch"
          s = s.replace(old, new)

          old = """        codec_->OutputData(task->pcm);

        /* Update the last output time */"""
          new = """        uint32_t pcm_peak = 0;
        for (int16_t sample : task->pcm) {
            uint32_t magnitude = sample < 0 ? (uint32_t)(-(int32_t)sample) : (uint32_t)sample;
            if (magnitude > pcm_peak) pcm_peak = magnitude;
        }
        static uint32_t pcm_output_log_count = 0;
        ++pcm_output_log_count;
        if (pcm_output_log_count <= 8 || pcm_output_log_count % 20 == 0) {
            ESP_LOGI(TAG, "PCM_OUTPUT: samples=%u peak=%u rate=%d count=%u",
                     (unsigned)task->pcm.size(), (unsigned)pcm_peak,
                     codec_->output_sample_rate(), (unsigned)pcm_output_log_count);
        }
        codec_->OutputData(task->pcm);

        /* Update the last output time */"""
          assert s.count(old) == 1, "Could not locate speaker PCM output call"
          s = s.replace(old, new)
          p.write_text(s)

          p = root / "codecs" / "no_audio_codec.cc"
          s = p.read_text()
          old = """    size_t bytes_written;
    ESP_ERROR_CHECK(i2s_channel_write(tx_handle_, buffer.data(), samples * sizeof(int32_t), &bytes_written, portMAX_DELAY));
    return bytes_written / sizeof(int32_t);"""
          new = """    size_t bytes_written = 0;
    const size_t requested_bytes = (size_t)samples * sizeof(int32_t);
    esp_err_t write_err = i2s_channel_write(tx_handle_, buffer.data(), requested_bytes,
                                           &bytes_written, portMAX_DELAY);
    if (write_err != ESP_OK) {
        ESP_LOGE(TAG, "I2S_WRITE: failed err=%s requested=%u",
                 esp_err_to_name(write_err), (unsigned)requested_bytes);
        ESP_ERROR_CHECK(write_err);
    }
    static uint32_t i2s_write_log_count = 0;
    ++i2s_write_log_count;
    if (i2s_write_log_count <= 8 || i2s_write_log_count % 20 == 0) {
        ESP_LOGI(TAG, "I2S_WRITE: requested=%u bytes=%u samples=%d count=%u",
                 (unsigned)requested_bytes, (unsigned)bytes_written,
                 samples, (unsigned)i2s_write_log_count);
    }
    return bytes_written / sizeof(int32_t);"""
          assert s.count(old) == 1, "Could not locate I2S speaker write call"
          s = s.replace(old, new)
          p.write_text(s)
          print("PASS: added rate-limited OPUS_RX, OPUS_DECODE, PCM_OUTPUT and actual I2S_WRITE diagnostics")
          PY

      - name: Prepare custom Waveshare ESP32-S3-Zero board
        run: node scripts/prepare-s3-zero.js

      - name: Configure ESP32-S3, 4MB flash, Quad PSRAM and English Hi Jason wake word
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-config.js build_config.json
          TARGET_DEFAULTS="xiaozhi-esp32/sdkconfig.defaults.esp32s3"
          test -f "$TARGET_DEFAULTS"
          sed -i '/^CONFIG_BOOTLOADER_LOG_LEVEL_NONE=y$/d;/^CONFIG_BOOTLOADER_LOG_LEVEL_INFO=y$/d' xiaozhi-esp32/sdkconfig.defaults "$TARGET_DEFAULTS" || true
          echo "CONFIG_BOOTLOADER_LOG_LEVEL_INFO=y" >> "$TARGET_DEFAULTS"

          sed -i '/^CONFIG_ESPTOOLPY_FLASHSIZE_/d;/^# CONFIG_ESPTOOLPY_FLASHSIZE_/d;/^CONFIG_ESPTOOLPY_FLASHSIZE=/d' "$TARGET_DEFAULTS"
          echo 'CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y' >> "$TARGET_DEFAULTS"
          echo 'CONFIG_ESPTOOLPY_FLASHSIZE="4MB"' >> "$TARGET_DEFAULTS"

          sed -i '/^CONFIG_PARTITION_TABLE_CUSTOM=/d;/^CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=/d' "$TARGET_DEFAULTS"
          echo 'CONFIG_PARTITION_TABLE_CUSTOM=y' >> "$TARGET_DEFAULTS"
          echo 'CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/4m.csv"' >> "$TARGET_DEFAULTS"
          test -f xiaozhi-esp32/partitions/v2/4m.csv

          sed -i '/^CONFIG_SPIRAM_MODE_/d;/^# CONFIG_SPIRAM_MODE_/d;/^CONFIG_SPIRAM_SPEED_/d' "$TARGET_DEFAULTS"
          echo 'CONFIG_SPIRAM=y' >> "$TARGET_DEFAULTS"
          echo '# CONFIG_SPIRAM_MODE_OCT is not set' >> "$TARGET_DEFAULTS"
          echo 'CONFIG_SPIRAM_MODE_QUAD=y' >> "$TARGET_DEFAULTS"
          echo 'CONFIG_SPIRAM_SPEED_80M=y' >> "$TARGET_DEFAULTS"

          sed -i '/^CONFIG_USE_CUSTOM_WAKE_WORD=/d;/^CONFIG_CUSTOM_WAKE_WORD=/d;/^CONFIG_CUSTOM_WAKE_WORD_DISPLAY=/d;/^CONFIG_CUSTOM_WAKE_WORD_THRESHOLD=/d;/^CONFIG_SR_MN_/d;/^CONFIG_SR_WN_/d;/^CONFIG_USE_AFE_WAKE_WORD=/d;/^CONFIG_USE_ESP_WAKE_WORD=/d' "$TARGET_DEFAULTS"
          echo 'CONFIG_USE_AFE_WAKE_WORD=y' >> "$TARGET_DEFAULTS"
          echo 'CONFIG_SR_WN_WN9_HIJASON_TTS2=y' >> "$TARGET_DEFAULTS"
          echo 'CONFIG_SEND_WAKE_WORD_DATA=y' >> "$TARGET_DEFAULTS"

          rm -f xiaozhi-esp32/sdkconfig
          rm -rf xiaozhi-esp32/build
          echo "=== Effective board defaults ==="
          grep -E 'FLASHSIZE|PARTITION_TABLE|SPIRAM_MODE|SPIRAM_SPEED|WAKE_WORD|SR_WN_|SR_MN_' "$TARGET_DEFAULTS"

      - name: Build firmware with ESP-IDF v6.0.2
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: xiaozhi-esp32

      - name: Verify built-in wake model and board configuration
        shell: bash
        run: |
          set -euo pipefail
          MODEL_INFO="xiaozhi-esp32/managed_components/espressif__esp-sr/model/wakenet_model/wn9_hijason_tts2/_MODEL_INFO_"
          test -f "$MODEL_INFO" || { echo "Missing Hi Jason WakeNet9 model"; find xiaozhi-esp32/managed_components -iname '*hijason*' -print || true; exit 1; }
          cp xiaozhi-esp32/sdkconfig output-sdkconfig.tmp
          grep -q '^CONFIG_USE_AFE_WAKE_WORD=y$' output-sdkconfig.tmp
          grep -q '^CONFIG_SR_WN_WN9_HIJASON_TTS2=y$' output-sdkconfig.tmp
          grep -q '^CONFIG_SEND_WAKE_WORD_DATA=y$' output-sdkconfig.tmp
          ! grep -q '^CONFIG_USE_CUSTOM_WAKE_WORD=y$' output-sdkconfig.tmp
          grep -q '^CONFIG_ESPTOOLPY_FLASHSIZE="4MB"$' output-sdkconfig.tmp
          grep -q '^CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/4m.csv"$' output-sdkconfig.tmp
          grep -q '^CONFIG_SPIRAM_MODE_QUAD=y$' output-sdkconfig.tmp
          echo "PASS: Hi Jason WakeNet9 TTS2 and 4MB/Quad PSRAM settings resolved"
          cat "$MODEL_INFO"

      - name: Package and verify flash images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/bootloader output/partition_table
          cp xiaozhi-esp32/build/*.bin output/
          cp xiaozhi-esp32/build/bootloader/*.bin output/bootloader/
          cp xiaozhi-esp32/build/partition_table/*.bin output/partition_table/
          cp xiaozhi-esp32/build/flasher_args.json output/
          cp xiaozhi-esp32/build/flash_args output/
          cp xiaozhi-esp32/build/flash_project_args output/
          cp xiaozhi-esp32/sdkconfig output/sdkconfig.txt
          cp xiaozhi-esp32/main/boards/s3-zero/config.h output/
          python3 - <<'PY'
          import json, pathlib, hashlib
          root = pathlib.Path("output")
          manifest = json.loads((root / "flasher_args.json").read_text())
          files = manifest.get("flash_files", {})
          if not files:
              raise SystemExit("No flash images in flasher_args.json")
          for offset_text, filename in files.items():
              offset = int(offset_text, 16)
              path = root / filename
              if not path.is_file():
                  raise SystemExit(f"Missing image: {filename}")
              end = offset + path.stat().st_size
              if end > 0x400000:
                  raise SystemExit(f"{filename} exceeds 4MB flash")
              print(f"PASS {filename} @ 0x{offset:X} size={path.stat().st_size} sha256={hashlib.sha256(path.read_bytes()).hexdigest()}")
          if manifest.get("extra_esptool_args", {}).get("chip") != "esp32s3":
              raise SystemExit("Wrong chip target")
          if manifest.get("flash_settings", {}).get("flash_size") != "4MB":
              raise SystemExit("Wrong flash size")
          PY
          (cd output && find . -type f -name '*.bin' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd output && sha256sum -c SHA256SUMS.txt)
          echo "Firmware images and manifests verified."

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-firmware-s3-zero-clean
          path: output/
          retention-days: 90
