# Build XiaoZhi ESP32 Firmware
# Triggered manually via workflow_dispatch or via GitHub API

name: Build XiaoZhi Firmware

on:
  push:
    branches:
      - esp32-s3-zero-support
  workflow_dispatch:
    inputs:
      board:
        description: 'Board type (directory name under main/boards/)'
        required: true
        type: string
        default: 's3-zero'
      chip:
        description: 'ESP32 chip target (esp32, esp32s3, esp32c3, esp32c5, esp32c6, esp32p4)'
        required: true
        type: string
        default: 'esp32s3'
      config_json:
        description: 'Board config as JSON (pins, display, language, extra_pins)'
        required: false
        type: string
        default: '{}'
      language:
        description: 'UI language code'
        required: false
        type: string
        default: 'en_US'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare custom Waveshare ESP32-S3-Zero board
        run: node scripts/prepare-s3-zero.js

      - name: Generate board config
        run: |
          echo "Using build_config.json"
          node scripts/generate-config.js build_config.json

          echo "Applying ESP32-S3-Zero 4MB Flash setting"
          sed -i '/^CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y$/d' xiaozhi-esp32/sdkconfig.defaults
          sed -i '/^# CONFIG_ESPTOOLPY_FLASHSIZE_16MB is not set$/d' xiaozhi-esp32/sdkconfig.defaults
          echo "# CONFIG_ESPTOOLPY_FLASHSIZE_16MB is not set" >> xiaozhi-esp32/sdkconfig.defaults
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y" >> xiaozhi-esp32/sdkconfig.defaults

          echo "Selecting Quad PSRAM for ESP32-S3FH4R2 (2MB)"
          sed -i '/^CONFIG_SPIRAM_MODE_OCT=y$/d' xiaozhi-esp32/sdkconfig.defaults
          sed -i '/^# CONFIG_SPIRAM_MODE_OCT is not set$/d' xiaozhi-esp32/sdkconfig.defaults
          sed -i '/^CONFIG_SPIRAM_MODE_QUAD=y$/d' xiaozhi-esp32/sdkconfig.defaults
          echo "CONFIG_SPIRAM=y" >> xiaozhi-esp32/sdkconfig.defaults
          echo "CONFIG_SPIRAM_MODE_QUAD=y" >> xiaozhi-esp32/sdkconfig.defaults
          echo "CONFIG_SPIRAM_SPEED_80M=y" >> xiaozhi-esp32/sdkconfig.defaults
          grep -E 'CONFIG_SPIRAM=|CONFIG_SPIRAM_MODE_QUAD=|CONFIG_SPIRAM_SPEED_80M=' xiaozhi-esp32/sdkconfig.defaults

      - name: Verify generated config
        run: |
          echo "=== config.h (first 60 lines) ==="
          head -60 xiaozhi-esp32/main/boards/${{ inputs.board || 's3-zero' }}/config.h
          echo ""
          echo "=== sdkconfig.defaults (last 30 lines) ==="
          tail -30 xiaozhi-esp32/sdkconfig.defaults
          echo ""
          echo "=== sdkconfig.defaults line count ==="
          wc -l xiaozhi-esp32/sdkconfig.defaults

      - name: Build firmware (ESP-IDF v6.0.2)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: ${{ inputs.chip || 'esp32s3' }}
          path: xiaozhi-esp32

      - name: Show build logs if failed
        if: failure()
        run: |
          echo "=== Build output (last 200 lines) ==="
          tail -200 xiaozhi-esp32/build/log/idf_py_stdout_output_* 2>/dev/null || echo "No stdout log"
          echo "=== Build errors ==="
          tail -200 xiaozhi-esp32/build/log/idf_py_stderr_output_* 2>/dev/null || echo "No stderr log"

      - name: Collect build artifacts
        if: success()
        run: |
          mkdir -p output
          cp xiaozhi-esp32/build/*.bin output/ 2>/dev/null || true
          cp xiaozhi-esp32/build/bootloader/*.bin output/ 2>/dev/null || true
          cp xiaozhi-esp32/build/partition_table/*.bin output/ 2>/dev/null || true

          # Preserve ESP-IDF's authoritative flash offsets and command arguments.
          cp xiaozhi-esp32/build/flasher_args.json output/ 2>/dev/null || true
          cp xiaozhi-esp32/build/flash_args output/ 2>/dev/null || true
          cp xiaozhi-esp32/build/flash_project_args output/ 2>/dev/null || true

          cp xiaozhi-esp32/sdkconfig output/sdkconfig.txt 2>/dev/null || true
          cp xiaozhi-esp32/main/boards/${{ inputs.board || 's3-zero' }}/config.h output/ 2>/dev/null || true

          echo "=== Flash metadata check ==="
          if [ ! -s output/flasher_args.json ]; then
            echo "ERROR: ESP-IDF flasher_args.json was not generated or copied."
            echo "Available flash-related files:"
            find xiaozhi-esp32/build -maxdepth 2 -type f \( -name '*flash*args*' -o -name 'flasher_args.json' \) -print
            exit 1
          fi
          echo "Verified output/flasher_args.json"
          cat output/flasher_args.json
          echo "=== Collected output files ==="
          ls -la output/

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-firmware-${{ inputs.board || 's3-zero' }}-${{ inputs.chip || 'esp32s3' }}
          path: output/
          retention-days: 90

      - name: Build summary
        if: success()
        run: |
          FW_SIZE=$(du -sh xiaozhi-esp32/build/*.bin 2>/dev/null | head -1 | cut -f1 || echo "unknown")
          echo "### ✅ Firmware Built :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Board:** ${{ inputs.board || 's3-zero' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Chip:** ${{ inputs.chip || 'esp32s3' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Language:** ${{ inputs.language || 'en_US' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Binaries:** $FW_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Chip:** ${{ inputs.chip || 'esp32s3' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Language:** ${{ inputs.language || 'en_US' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Binaries:** $FW_SIZE" >> $GITHUB_STEP_SUMMARY
