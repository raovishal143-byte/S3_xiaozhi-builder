name: Build JARVIS Firmware

on:
  push:
    branches:
      - jarvis-english-clean-start
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository and XiaoZhi submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install board profile and apply JARVIS firmware patches
        run: |
          python3 scripts/prepare-jarvis-firmware.py
          node scripts/generate-config.js build_config.json

      - name: Verify JARVIS board and audio configuration before build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cfg = Path("xiaozhi-esp32/main/boards/jarvis-s3-zero/config.h").read_text()
          expected = {
              "AUDIO_INPUT_SAMPLE_RATE": "16000",
              "AUDIO_OUTPUT_SAMPLE_RATE": "32000",
              "AUDIO_I2S_MIC_GPIO_SCK": "GPIO_NUM_4",
              "AUDIO_I2S_MIC_GPIO_WS": "GPIO_NUM_5",
              "AUDIO_I2S_MIC_GPIO_DIN": "GPIO_NUM_6",
              "AUDIO_I2S_SPK_GPIO_BCLK": "GPIO_NUM_7",
              "AUDIO_I2S_SPK_GPIO_LRCK": "GPIO_NUM_8",
              "AUDIO_I2S_SPK_GPIO_DOUT": "GPIO_NUM_9",
              "BUILTIN_LED_GPIO": "GPIO_NUM_21",
          }
          actual = {}
          for name, value in expected.items():
              match = re.search(r"^\s*#define\s+" + re.escape(name) + r"\s+([^\s/]+)", cfg, re.M)
              actual[name] = match.group(1) if match else "<missing>"
              if actual[name] != value:
                  raise SystemExit(f"{name}: expected {value}, found {actual[name]}")
          if re.search(r"GPIO_NUM_2(?:\D|$)", cfg) or re.search(r"EXTERNAL_LED", cfg):
              raise SystemExit("Unexpected GPIO2/external LED definition in board config")
          codec = Path("xiaozhi-esp32/main/audio/codecs/no_audio_codec.cc").read_text()
          audio = Path("xiaozhi-esp32/main/audio/audio_codec.cc").read_text()
          if "volume_factor = (int32_t(output_volume_) * 65536) / 100;" not in codec:
              raise SystemExit("Linear output volume patch missing")
          if "output_volume_ = 100;" not in audio:
              raise SystemExit("Forced 100% output volume patch missing")
          print("Verified board config:", actual)
          print("Verified linear 100% output volume patch.")
          PY

      - name: Build ESP32-S3-Zero firmware with offline Jarvis wake model
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: xiaozhi-esp32
          command: >-
            apt-get update &&
            apt-get install -y espeak-ng ffmpeg &&
            python3 ../scripts/generate-greeting-header.py &&
            python3 scripts/build.py jarvis-s3-zero --language en-US --wake-word wn9_jarvis_tts

      - name: Verify flash, memory, wake-word and merged image
        if: success()
        run: |
          grep -q '^CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y$' xiaozhi-esp32/sdkconfig
          grep -q '^CONFIG_SPIRAM=y$' xiaozhi-esp32/sdkconfig
          grep -q '^CONFIG_SPIRAM_MODE_QUAD=y$' xiaozhi-esp32/sdkconfig
          ! grep -q '^CONFIG_SPIRAM_MODE_OCT=y$' xiaozhi-esp32/sdkconfig
          grep -q '^CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/4m.csv"$' xiaozhi-esp32/sdkconfig
          grep -q '^CONFIG_USE_AFE_WAKE_WORD=y$' xiaozhi-esp32/sdkconfig
          grep -q '^CONFIG_SR_WN_WN9_JARVIS_TTS=y$' xiaozhi-esp32/sdkconfig
          MERGED=xiaozhi-esp32/build/merged-binary.bin
          test -s "$MERGED"
          python3 - <<'PY'
          from pathlib import Path
          image = Path("xiaozhi-esp32/build/merged-binary.bin").read_bytes()
          assert image[0] == 0xE9, f"Unexpected ESP image magic: {image[0]:02x}"
          assert image[2] == 0x02, f"Expected DIO flash mode, got {image[2]:02x}"
          assert image[3] == 0x2F, f"Expected 4MB/80MHz flash config 0x2f, got {image[3]:02x}"
          assert len(image) <= 4 * 1024 * 1024, f"Merged image too large: {len(image)}"
          print(f"Verified DIO/80MHz/4MB image, {len(image)} bytes")
          PY

      - name: Collect firmware files
        if: success()
        run: |
          mkdir -p output
          find xiaozhi-esp32/build -maxdepth 2 -type f -name '*.bin' -exec cp -t output/ {} +
          cp xiaozhi-esp32/sdkconfig output/sdkconfig.txt
          cp xiaozhi-esp32/main/boards/jarvis-s3-zero/config.h output/
          cp xiaozhi-esp32/build/merged-binary.bin output/
          ls -lh output/

      - name: Upload JARVIS firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-waveshare-esp32-s3-zero
          path: output/
          retention-days: 90

      - name: Show failure logs
        if: failure()
        run: |
          find xiaozhi-esp32/build/log -type f -maxdepth 1 -print -exec tail -150 {} + 2>/dev/null || true
