name: Build Waveshare ESP32-S3-Zero XiaoZhi Firmware
# Rebuild: use GRB ordering for true red WS2812 startup flashes; set Camaro startup audio to -8 LUFS; preserve breathing yellow standby, Jarvis, scanner, audio-buffer, and Quad PSRAM settings.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-waveshare-s3-zero.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Checkout customized XiaoZhi firmware source
        uses: actions/checkout@v4
        with:
          repository: raovishal143-byte/xiaozhi-esp32
          ref: waveshare-s3-zero-voice-assistant
          path: xiaozhi-esp32
          submodules: recursive

      - name: Synchronize startup LED sequence with startup audio
        run: python scripts/patch-startup-sequence.py

      - name: Generate spoken startup greeting
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          mkdir -p xiaozhi-esp32/main/assets/locales/en-US
          espeak-ng -v en-us -s 148 -a 160 -w /tmp/hi_there.wav "Hi there"

          # Build one startup sound: normalized Camaro clip (max 7 seconds), 2 seconds silence,
          # then a louder spoken greeting. Fade the engine sound over its final 2 seconds.
          car_mp3="xiaozhi-esp32/main/boards/waveshare-esp32-s3-zero-xiaozhi/audio/camaro-ss-loud_to use.mp3"
          test -s "$car_mp3"
          car_source_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$car_mp3")"
          car_duration="$(python -c 'import sys; print(min(7.0, float(sys.argv[1])))' "$car_source_duration")"
          fade_duration="$(python -c 'import sys; print(min(2.0, float(sys.argv[1])))' "$car_duration")"
          fade_start="$(python -c 'import sys; print(max(0.0, float(sys.argv[1]) - float(sys.argv[2])))' "$car_duration" "$fade_duration")"
          echo "Camaro clip source duration: $car_source_duration s; using $car_duration s with $fade_duration s fade"

          # Prepare the greeting first, preserving its +7 dB boost and peak limiter.
          ffmpeg -y -i /tmp/hi_there.wav -af "volume=7dB,alimiter=limit=0.95:attack=5:release=50:level=false" -ac 1 -ar 24000 -c:a pcm_s16le /tmp/hi_there_boosted.wav

          # Measure the actual integrated loudness of the final greeting and use it
          # as the Camaro target, rather than assuming a fixed LUFS value.
          ffmpeg -hide_banner -i /tmp/hi_there_boosted.wav -af "loudnorm=I=-24:TP=-1.0:LRA=7:print_format=json" -f null - 2> /tmp/greeting_loudness.txt
          greeting_lufs="$(python - <<'PY'
          import json, re
          from pathlib import Path
          text = Path('/tmp/greeting_loudness.txt').read_text()
          blocks = re.findall(r'\{\s*"input_i".*?\}', text, re.S)
          if not blocks:
              raise SystemExit('Could not measure Hi there loudness')
          value = json.loads(blocks[-1])['input_i']
          if value == '-inf':
              raise SystemExit('Hi there loudness measurement was -inf')
          print(value)
          PY
          )"
          echo "Measured Hi there integrated loudness: $greeting_lufs LUFS"

          # Match the measured final encoded loudness; the previous Opus check showed the fade/codec path left Camaro 5.5 LU quieter. Add that measured compensation and limit peaks safely.
          ffmpeg -y -i "$car_mp3" -af "loudnorm=I=$greeting_lufs:TP=-1.0:LRA=7,volume=5.5dB,alimiter=limit=0.95:attack=5:release=50:level=false,atrim=duration=$car_duration,afade=t=out:st=$fade_start:d=$fade_duration" -ac 1 -ar 24000 -c:a pcm_s16le /tmp/camaro.wav
          ffmpeg -y -f lavfi -i "anullsrc=r=24000:cl=mono" -t 2 -ac 1 -ar 24000 -c:a pcm_s16le /tmp/startup_silence.wav

          printf '%s\n' "file '/tmp/camaro.wav'" "file '/tmp/startup_silence.wav'" "file '/tmp/hi_there_boosted.wav'" > /tmp/startup_concat.txt
          ffmpeg -y -f concat -safe 0 -i /tmp/startup_concat.txt -ac 1 -ar 24000 -c:a libopus -application voip -frame_duration 20 -b:a 48k -vbr on xiaozhi-esp32/main/assets/locales/en-US/hi_there.ogg
          # XiaoZhi decodes Ogg Opus, not Ogg Vorbis.
          codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 xiaozhi-esp32/main/assets/locales/en-US/hi_there.ogg)"
          channels="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=noprint_wrappers=1:nokey=1 xiaozhi-esp32/main/assets/locales/en-US/hi_there.ogg)"
          test "$codec" = "opus"
          test "$channels" = "1"
          echo "Verified greeting: codec=$codec channels=$channels"

          # Measure the decoded, final Opus asset by segment (not the pre-encode WAV).
          greeting_duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/hi_there_boosted.wav)"
          greeting_start="$(python -c 'import sys; print(float(sys.argv[1]) + 2.0)' "$car_duration")"
          ffmpeg -hide_banner -i xiaozhi-esp32/main/assets/locales/en-US/hi_there.ogg -af "atrim=start=0:end=$car_duration,loudnorm=I=-24:TP=-1.0:LRA=7:print_format=json" -f null - 2> /tmp/final_car_loudness.txt
          ffmpeg -hide_banner -i xiaozhi-esp32/main/assets/locales/en-US/hi_there.ogg -af "atrim=start=$greeting_start:duration=$greeting_duration,loudnorm=I=-24:TP=-1.0:LRA=7:print_format=json" -f null - 2> /tmp/final_greeting_loudness.txt
          python - <<'PY'
          import json, re
          from pathlib import Path
          def read_lufs(path):
              text = Path(path).read_text()
              blocks = re.findall(r'\{\s*"input_i".*?\}', text, re.S)
              if not blocks:
                  raise SystemExit(f"Could not measure final encoded segment: {path}")
              value = json.loads(blocks[-1])["input_i"]
              if value == "-inf":
                  raise SystemExit(f"Final encoded segment is silent: {path}")
              return float(value)
          car = read_lufs("/tmp/final_car_loudness.txt")
          greeting = read_lufs("/tmp/final_greeting_loudness.txt")
          delta = abs(car - greeting)
          print(f"FINAL OPUS LOUDNESS: Camaro={car:.2f} LUFS, Hi there={greeting:.2f} LUFS, difference={delta:.2f} LU")
          if delta > 2.0:
              raise SystemExit("Final encoded Camaro and greeting differ by more than 2 LU; refusing to publish an unverified artifact")
          PY
          python xiaozhi-esp32/scripts/gen_lang.py --language en-US --output xiaozhi-esp32/main/assets/lang_config.h
          grep -q "OGG_HI_THERE" xiaozhi-esp32/main/assets/lang_config.h
          echo "Verified OGG_HI_THERE is embedded in the generated language header"

      # The board config selects Quad SPI PSRAM for the ESP32-S3FH4R2 chip.
      - name: Build firmware with Jarvis wake word
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: xiaozhi-esp32
          command: python scripts/build.py waveshare-esp32-s3-zero-xiaozhi --language en-US --wake-word wn9_jarvis_tts

      - name: Verify board memory and firmware requirements
        run: |
          grep -q '^CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y' xiaozhi-esp32/sdkconfig
          grep -q '^CONFIG_SPIRAM=y' xiaozhi-esp32/sdkconfig
          grep -q '^CONFIG_SPIRAM_MODE_QUAD=y' xiaozhi-esp32/sdkconfig
          grep -q 'wn9_jarvis_tts' xiaozhi-esp32/build/build.log || true
          echo "Verified 4MB flash and Quad PSRAM sdkconfig"

      - name: Verify merged firmware
        run: |
          test -s xiaozhi-esp32/build/merged-binary.bin
          ls -lh xiaozhi-esp32/build/merged-binary.bin
          sha256sum xiaozhi-esp32/build/merged-binary.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-s3-zero-jarvis-quad-psram
          path: |
            xiaozhi-esp32/build/merged-binary.bin
            xiaozhi-esp32/sdkconfig
          if-no-files-found: error
          retention-days: 30

# Rebuild after adding explicit ESP timer include to the microphone diagnostic.
# Rebuild after the diagnostic uses std::sqrt.
# Rebuild after correcting INMP441 24-bit sample scaling to 16-bit PCM.
# Include immediate wake-word LED indication during the connecting state.
# Rebuild for speaker-path diagnostics: Opus PCM and I2S write instrumentation.
# Rebuild after restoring mic scaling, preserving startup LED flashes, and correcting speaker volume scaling.
# Rebuild after adding raw INMP441 I2S diagnostics and reliable LED startup/task checks.
# Rebuild after removing external GPIO2 and amplifier SD control; add onboard RGB status and six-LED KITT scanner.
