name: Build Waveshare ESP32-S3-Zero XiaoZhi Firmware
# Rebuild requested for microphone diagnostics and wake-word LED feedback.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-waveshare-s3-zero.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Checkout customized XiaoZhi firmware source
        uses: actions/checkout@v4
        with:
          repository: raovishal143-byte/xiaozhi-esp32
          ref: waveshare-s3-zero-voice-assistant
          path: xiaozhi-esp32
          submodules: recursive

      - name: Generate spoken startup greeting
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          mkdir -p xiaozhi-esp32/main/assets/locales/en-US
          espeak-ng -v en-us -s 148 -a 160 -w /tmp/hi_there.wav "Hi there"
          # XiaoZhi decodes Ogg Opus, not Ogg Vorbis.
          ffmpeg -y -i /tmp/hi_there.wav -ac 1 -ar 24000 -c:a libopus -application voip -frame_duration 20 -b:a 24k -vbr on xiaozhi-esp32/main/assets/locales/en-US/hi_there.ogg
          codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 xiaozhi-esp32/main/assets/locales/en-US/hi_there.ogg)"
          channels="$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=noprint_wrappers=1:nokey=1 xiaozhi-esp32/main/assets/locales/en-US/hi_there.ogg)"
          test "$codec" = "opus"
          test "$channels" = "1"
          echo "Verified greeting: codec=$codec channels=$channels"
          python xiaozhi-esp32/scripts/gen_lang.py --language en-US --output xiaozhi-esp32/main/assets/lang_config.h

      # The board config selects Quad SPI PSRAM for the ESP32-S3FH4R2 chip.
      - name: Build firmware with Jarvis wake word
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: xiaozhi-esp32
          command: python scripts/build.py waveshare-esp32-s3-zero-xiaozhi --language en-US --wake-word wn9_jarvis_tts

      - name: Verify merged firmware
        run: |
          test -s xiaozhi-esp32/build/merged-binary.bin
          ls -lh xiaozhi-esp32/build/merged-binary.bin
          sha256sum xiaozhi-esp32/build/merged-binary.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-s3-zero-jarvis-quad-psram
          path: |
            xiaozhi-esp32/build/merged-binary.bin
            xiaozhi-esp32/sdkconfig
          if-no-files-found: error
          retention-days: 30

# Rebuild after adding explicit ESP timer include to the microphone diagnostic.
